<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Taskify</h1>
    <div class="container">
        <input id="input" type="text" placeholder="enter your tasks">
        <button id="addbtn">Add</button>
        <button id="deleteAll">deleteAll</button>
        <h4 id="lastadd">last add : none</h4>
        <h4 id="counterlimit">Max characters = 50</h4>
        <h3 id="count">Tasks count : 0</h3>
        
        <div id="list"></div>
        <h2 id="message"></h2>
    </div>
    <script src="script.js"></script>
</body>
</html>
