<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keyboard Speed Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Keyboard Speed Counter ⌨️</h1>
    <div class="conteiner">
      <p>follow these word</p>
      <h3>The quick brown fox jumps over the lazy dog</h3>

      <input id="input" type="text" placeholder="write here" />
      <button id="reset">Reset</button>
      <h4 id="right">Correct letter :</h4>

      <h3 id="typemessage">Characters typed:</h3>
      <h3 id="mistakemessage">Mistakes:</h3>
    </div>
    <script src="script.js"></script>
  </body>
</html>
