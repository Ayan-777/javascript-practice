<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Search Filter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Real-Time Search Filter</h1>
    <div class="container">
      <input id="Searchbox" type="text" placeholder="Search your item" />
      <button id="Searchbtn">🔍</button>

      <ul id="items">
        <li>DosaMatic</li>
        <li>3D Food Printer</li>
        <li>Robotic Coffee Barista</li>
        <li>Ultrasonic Slicer</li>
        <li>Smart Oven</li>
        <li>High-Pressure Processing (HPP) Machine</li>
        <li>Automatic Gol Gappa Machine</li>
        <li>Vegetable Dicing Machine</li>
        <li>Encrusting Machine</li>
        <li>Vacuum Tumbler</li>
      </ul>
      <h3 id="message"></h3>
    </div>
    <script src="script.js"></script>
  </body>
</html>
