<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Password Strength Checker 🔐</h1>
    <div class="conteiner">
      <div class="input-box">
        <input id="input" type="password" placeholder="Set your Password" />
        <button id="showbtn">👁️</button>
      </div>
      <h3 id="strengthmessage"></h3>
      <h4>Rules</h4>
      <ul>
        <li>at least 6 characters</li>
        <li>contains letters + numbers</li>
        <li>Add special characters</li>
      </ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>
